# 12FactorApp: committed working dev defaults; env overrides. (yml-only rule, configuration.md p19)
spring:
  # SCRUM-42: shared per-client exchange layout (platform-batch autoconfigures ExchangeLayout from this).
  config:
    import: classpath:dcre-exchange-layout.yml
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DCRE_DB_URL:jdbc:postgresql://localhost:26257/dcre_col?sslmode=disable}
    username: ${DCRE_DB_USER:root}
    password: ${DCRE_DB_PASSWORD:}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Shared DB, per-service migration history (same isolation idea as CRW_BATCH_)
    database-change-log-table: crw_databasechangelog
    database-change-log-lock-table: crw_databasechangeloglock

dcre:
  batch:
    table-prefix: CRW_BATCH_
  agtops-db-url: ${DCRE_AGTOPS_DB_URL:jdbc:postgresql://localhost:26257/agt_ops?sslmode=disable}
  agtops-db-user: ${DCRE_AGTOPS_DB_USER:root}
  agtops-db-password: ${DCRE_AGTOPS_DB_PASSWORD:}
  exchange-root: ${DCRE_EXCHANGE_ROOT:../../../../../infra/dcre-infra/exchange}
  amount-scale: ${DCRE_AMOUNT_SCALE:2}
  v1-enabled: ${DCRE_V1_ENABLED:false}
  flow-dc: ${DCRE_FLOW_DC:true}
  crw:
    # SCRUM-55 Feature 2: parallel client-lane cap; PartitionSizer clamps it to the
    # pod's CPU count at runtime (mirrors CTV/CRR max-partitions).
    max-partitions: ${DCRE_CRW_MAX_PARTITIONS:5}
    split:
      # SCRUM-55: max tx per outbound pain.008. Default 5000 (Sean 2026-07-16).
      # Per-client override map (add keys as dcre.crw.split.overrides.[CLIENT]: N; an
      # inline empty {} breaks Boot map binding, so the key stays absent by default);
      # a JobLauncher program arg --dcre.crw.split.max-size=N wins.
      # INTERIM home until the R-14 client reference table materializes (R-39).
      max-size: ${DCRE_CRW_MAX_SPLIT_SIZE:5000}
